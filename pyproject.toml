[project]
name = "awake"
version = "0.3.0"
description = "Awake — keep your computer awake while you work. Stay focused. Stay awake."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7", "psutil>=5.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "native: exercises the real OS power API (run with -m native on real hardware)",
]
