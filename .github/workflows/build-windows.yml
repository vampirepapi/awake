name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # used by release.yml

jobs:
  build:
    name: Test & package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      - name: Unit tests
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q -m "not native"

      - name: Native SetThreadExecutionState tests (checked with powercfg)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -m native -v -rs

      - name: Probe Claude Code agent detection (informational)
        # Does `claude agents --json` work on Windows, and does Awake's process matching
        # recognise a running claude.exe? Reports only; never fails the build.
        shell: pwsh
        continue-on-error: true
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          irm https://claude.ai/install.ps1 | iex
          $claude = "$env:USERPROFILE\.local\bin\claude.exe"
          $proc = $null
          if (Test-Path $claude) {
            # Best effort: a live claude.exe lets the probe exercise process matching.
            $proc = Start-Process -FilePath $claude -PassThru -WindowStyle Hidden -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          .venv\Scripts\python scripts\probe_claude_agents.py
          if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Awake.exe and installer
        shell: cmd
        run: scripts\build_windows.bat

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = .venv\Scripts\python -c "import awake; print(awake.__version__)"
          Compress-Archive -Path dist\Awake -DestinationPath "dist\Awake-$version-Windows-x64-portable.zip"
          if (-not (Test-Path "dist\Awake-$version-Setup.exe")) { throw "Installer was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: Awake-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
          if-no-files-found: error
