name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # used by release.yml

jobs:
  build:
    name: Test & package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      - name: Unit tests
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q -m "not native"

      - name: Native SetThreadExecutionState tests (checked with powercfg)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -m native -v -rs

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Awake.exe and installer
        shell: cmd
        run: scripts\build_windows.bat

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = .venv\Scripts\python -c "import awake; print(awake.__version__)"
          Compress-Archive -Path dist\Awake -DestinationPath "dist\Awake-$version-Windows-x64-portable.zip"
          if (-not (Test-Path "dist\Awake-$version-Setup.exe")) { throw "Installer was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: Awake-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
          if-no-files-found: error
